<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1a0f;
      --surface: #162016;
      --border: #2a3d2a;
      --text: #e8ead4;
      --muted: #7a8c6a;
      --accent: #8fbc5a;
      --connu: #4caf50;
      --r3: #ff9f6b;
      --r5: #f4c542;
      --r20: #e05555;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    header { text-align: center; margin-bottom: 28px; }
    header h1 {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    header p {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 4px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mode-nav { display: flex; gap: 8px; margin-bottom: 24px; }
    .mode-nav button {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 18px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-nav button.actif { background: var(--accent); color: var(--bg); border-color: var(--accent); }

    .carte {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .carte-photo { width: 100%; height: 320px; object-fit: cover; display: block; background: #1a2a1a; }
    .carte-photo-erreur {
      width: 100%; height: 320px;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.8rem; background: #1a2a1a; font-style: italic;
    }

    .carte-body { padding: 24px; }

    .champ {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 12px;
      align-items: start;
    }
    .champ:last-child { border-bottom: none; }
    .champ-label {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--muted); padding-top: 2px;
    }
    .champ-valeur {
      font-family: var(--font-serif); font-size: 1rem;
      color: var(--text); line-height: 1.5;
      white-space: pre-line;
    }
    .champ-valeur.latin { font-style: italic; color: var(--accent); }
    .champ-valeur.formule { font-family: var(--font-mono); font-size: 0.85rem; color: #b8d49a; white-space: pre-line; }
    .champ-valeur.masque {
      color: transparent; background: var(--border);
      border-radius: 2px; user-select: none; cursor: default; min-height: 1.4em;
    }

    .carte-actions {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }

    .btn-reveler {
      font-family: var(--font-mono); font-size: 0.78rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 10px 22px;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      border-radius: 2px; cursor: pointer; transition: all 0.2s; width: 100%;
    }
    .btn-reveler:hover { background: var(--accent); color: var(--bg); }

    .evaluation { display: none; width: 100%; }
    .evaluation.visible { display: block; }
    .eval-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px; }
    .eval-boutons { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-eval {
      font-family: var(--font-mono); font-size: 0.8rem;
      padding: 10px 20px; border: none; border-radius: 3px;
      cursor: pointer; flex: 1; min-width: 70px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-eval:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-eval:active { transform: translateY(0); }
    .btn-connu { background: var(--connu); color: #fff; }
    .btn-r3    { background: var(--r3);    color: #1a0a00; }
    .btn-r5    { background: var(--r5);    color: #1a1200; }
    .btn-r20   { background: var(--r20);   color: #fff; }

    .stats {
      width: 100%; max-width: 680px; margin-top: 16px;
      display: flex; gap: 24px; font-size: 0.72rem;
      color: var(--muted); letter-spacing: 0.08em; flex-wrap: wrap;
    }
    .stats span { display: flex; align-items: center; gap: 6px; }
    .stats .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

    .reset-btn {
      margin-top: 8px; font-family: var(--font-mono); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 5px 12px; border: 1px solid var(--r20);
      background: transparent; color: var(--r20); border-radius: 2px;
      cursor: pointer; transition: all 0.2s;
    }
    .reset-btn:hover { background: var(--r20); color: #fff; }

    .nav-apprendre {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 24px; border-top: 1px solid var(--border);
    }
    .nav-apprendre button {
      font-family: var(--font-mono); font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 8px 18px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      border-radius: 2px; cursor: pointer; transition: border-color 0.2s;
    }
    .nav-apprendre button:hover { border-color: var(--accent); }
    .nav-apprendre button:disabled { opacity: 0.3; cursor: default; }
    .nav-apprendre .compteur { font-size: 0.72rem; color: var(--muted); flex: 1; text-align: center; }

    .fin { text-align: center; padding: 48px 24px; }
    .fin h2 { font-family: var(--font-serif); font-size: 1.8rem; color: var(--accent); margin-bottom: 12px; }
    .fin p { color: var(--muted); font-size: 0.82rem; margin-bottom: 24px; }
    .fin button {
      font-family: var(--font-mono); font-size: 0.78rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      padding: 10px 24px; border: 1px solid var(--accent);
      background: transparent; color: var(--accent); border-radius: 2px; cursor: pointer;
    }
    .fin button:hover { background: var(--accent); color: var(--bg); }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--accent);
      color: var(--accent); font-size: 0.72rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 8px 18px; border-radius: 2px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.visible { opacity: 1; }

    @media (max-width: 500px) {
      .champ { grid-template-columns: 1fr; gap: 4px; }
      .champ-label { padding-bottom: 2px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Flora</h1>
  <p>Botanique · Répétition espacée</p>
</header>

<div class="mode-nav">
  <button id="btn-apprendre" onclick="setMode('apprendre')">Apprendre</button>
  <button id="btn-quiz" class="actif" onclick="setMode('quiz')">Quiz</button>
</div>

<div class="carte" id="carte"></div>

<div class="stats" id="stats"></div>
<div style="max-width:680px;width:100%;margin-top:8px">
  <button class="reset-btn" onclick="confirmerReset()">↺ Réinitialiser la progression</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CLE = 'flora_progression';
const CLE_DERNIERE = 'flora_derniere_utilisation';
let plantes = [];
let mode = 'quiz';
let idxApprendre = 0;
let file = [];
let connues = new Set();
let tour = 0;
const DELAIS = { connu: 0, r3: 3, r5: 5, r20: 20 };

/* ── ENREGISTREMENT DERNIÈRE UTILISATION ── */
function enregistrerUtilisation() {
  try { localStorage.setItem(CLE_DERNIERE, Date.now().toString()); } catch(e) {}
}

/* ── SAUVEGARDE PROGRESSION ── */
function sauvegarder() {
  try {
    localStorage.setItem(CLE, JSON.stringify({
      file: file, connues: [...connues], tour: tour
    }));
  } catch(e) {}
}

function chargerProgression() {
  try {
    const raw = localStorage.getItem(CLE);
    if (!raw) return false;
    const data = JSON.parse(raw);
    file    = data.file;
    connues = new Set(data.connues);
    tour    = data.tour;
    return true;
  } catch(e) { return false; }
}

function confirmerReset() {
  if (confirm('Réinitialiser toute la progression ? Cette action est irréversible.')) {
    try { localStorage.removeItem(CLE); } catch(e) {}
    connues.clear(); tour = 0;
    file = plantes.map(p => ({ id: p.id, due: 0 }));
    sauvegarder();
    afficherQuiz();
    showToast('Progression réinitialisée');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2000);
}

/* ── CHARGEMENT ── */
fetch('plants.json')
  .then(r => r.json())
  .then(data => {
    plantes = data;
    const ok = chargerProgression();
    if (ok) {
      plantes.forEach(p => {
        if (!file.find(f => f.id === p.id)) file.push({ id: p.id, due: 0 });
      });
    } else {
      file = plantes.map(p => ({ id: p.id, due: 0 }));
    }
    enregistrerUtilisation();
    setMode('quiz');
    if (ok) showToast('Progression restaurée');
  })
  .catch(() => {
    document.getElementById('carte').innerHTML =
      '<div style="padding:32px;color:#e05555;font-size:0.85rem">Erreur : impossible de charger plants.json.</div>';
  });

function setMode(m) {
  mode = m;
  document.getElementById('btn-apprendre').classList.toggle('actif', m === 'apprendre');
  document.getElementById('btn-quiz').classList.toggle('actif', m === 'quiz');
  if (m === 'apprendre') { idxApprendre = 0; afficherApprendre(); }
  else afficherQuiz();
}

/* ── MODE APPRENDRE ── */
function afficherApprendre() {
  const p = plantes[idxApprendre];
  const total = plantes.length;
  const carte = document.getElementById('carte');
  carte.innerHTML = '';
  document.getElementById('stats').innerHTML = '';

  carte.appendChild(makePhoto(p));

  const body = document.createElement('div');
  body.className = 'carte-body';
  body.innerHTML =
    champ('Nom vernaculaire', p.nom) +
    champ('Nom latin', p.nom_latin, 'latin') +
    champ('Famille', p.famille) +
    champ('Formule florale', p.formule_florale, 'formule') +
    champ('Type de fruit', p.type_fruit) +
    champ('Caractéristiques', p.caracteristiques);
  carte.appendChild(body);

  const nav = document.createElement('div');
  nav.className = 'nav-apprendre';
  nav.innerHTML = `
    <button onclick="apprendre(-1)" ${idxApprendre === 0 ? 'disabled' : ''}>← Préc.</button>
    <span class="compteur">${idxApprendre + 1} / ${total}</span>
    <button onclick="apprendre(1)" ${idxApprendre === total - 1 ? 'disabled' : ''}>Suiv. →</button>
  `;
  carte.appendChild(nav);
}

function apprendre(dir) {
  idxApprendre = Math.max(0, Math.min(plantes.length - 1, idxApprendre + dir));
  afficherApprendre();
}

/* ── MODE QUIZ ── */
function afficherQuiz() {
  const carte = document.getElementById('carte');
  carte.innerHTML = '';
  const disponibles = file.filter(f => f.due <= tour && !connues.has(f.id));

  if (disponibles.length === 0) { afficherFin(); return; }

  const item = disponibles[0];
  const p = plantes.find(x => x.id === item.id);

  carte.appendChild(makePhoto(p));

  const body = document.createElement('div');
  body.className = 'carte-body';
  body.innerHTML =
    champ('Nom vernaculaire', p.nom, '', true) +
    champ('Nom latin', p.nom_latin, 'latin', true) +
    champ('Famille', p.famille, '', true) +
    champ('Formule florale', p.formule_florale, 'formule', true) +
    champ('Type de fruit', p.type_fruit, '', true) +
    champ('Caractéristiques', p.caracteristiques, '', true);
  carte.appendChild(body);

  const actions = document.createElement('div');
  actions.className = 'carte-actions';
  actions.innerHTML = `
    <button class="btn-reveler" id="btn-rev" onclick="reveler(${p.id})">Révéler la réponse</button>
    <div class="evaluation" id="eval">
      <div class="eval-label">Je savais…</div>
      <div class="eval-boutons">
        <button class="btn-eval btn-connu" onclick="evaluer(${p.id},'connu')">Connu</button>
        <button class="btn-eval btn-r3"    onclick="evaluer(${p.id},'r3')">+3</button>
        <button class="btn-eval btn-r5"    onclick="evaluer(${p.id},'r5')">+5</button>
        <button class="btn-eval btn-r20"   onclick="evaluer(${p.id},'r20')">+20</button>
      </div>
    </div>`;
  carte.appendChild(actions);

  afficherStats();
}

function reveler(id) {
  const p = plantes.find(x => x.id === id);
  const vals = [p.nom, p.nom_latin, p.famille, p.formule_florale, p.type_fruit, p.caracteristiques];
  const cls  = ['', 'latin', '', 'formule', '', ''];
  document.querySelectorAll('.champ-valeur.masque').forEach((el, i) => {
    el.className = 'champ-valeur' + (cls[i] ? ' ' + cls[i] : '');
    el.textContent = vals[i];
  });
  document.getElementById('btn-rev').style.display = 'none';
  document.getElementById('eval').classList.add('visible');
}

function evaluer(id, note) {
  const item = file.find(f => f.id === id);
  if (note === 'connu') { connues.add(id); }
  else { item.due = tour + DELAIS[note]; }
  tour++;
  sauvegarder();
  afficherQuiz();
}

function afficherFin() {
  document.getElementById('carte').innerHTML = `
    <div class="fin">
      <h2>Session terminée</h2>
      <p>${connues.size} plante${connues.size > 1 ? 's' : ''} connue${connues.size > 1 ? 's' : ''} sur ${plantes.length}</p>
      <button onclick="recommencer()">Recommencer</button>
    </div>`;
  document.getElementById('stats').innerHTML = '';
}

function recommencer() {
  connues.clear(); tour = 0;
  file = plantes.map(p => ({ id: p.id, due: 0 }));
  sauvegarder();
  afficherQuiz();
}

/* ── UTILITAIRES ── */
function champ(label, valeur, cls, masquer) {
  const c = cls ? ` ${cls}` : '';
  const m = masquer ? ' masque' : '';
  const v = masquer ? '██████' : valeur;
  return `<div class="champ">
    <span class="champ-label">${label}</span>
    <span class="champ-valeur${c}${m}">${v}</span>
  </div>`;
}

function makePhoto(p) {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = `<div class="carte-photo-erreur">Chargement…</div>`;
  const img = new Image();
  img.onload = () => {
    img.className = 'carte-photo';
    wrapper.innerHTML = '';
    wrapper.appendChild(img);
  };
  img.onerror = () => {
    wrapper.innerHTML = `<div class="carte-photo-erreur">Photo non trouvée : ${p.photo}</div>`;
  };
  img.src = p.photo;
  img.alt = p.nom;
  return wrapper;
}
</script>
</body>
</html>
